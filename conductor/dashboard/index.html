<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop Conductor · Dashboard</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="board-shell" id="board-shell" tabindex="-1">
<header class="top">
  <div class="header-main">
    <h1>Loop Conductor</h1>
    <nav class="view-nav" id="view-nav">
      <button class="view-nav-btn active" id="nav-board" data-view="board">Board</button>
      <button class="view-nav-btn" id="nav-metrics" data-view="metrics">Metrics</button>
    </nav>
    <button class="btn btn-primary" id="btn-new-task">+ New task</button>
  </div>
  <div class="header-stats" id="header-stats"></div>
  <div class="header-activity" id="header-activity"></div>
</header>

<div id="view-board">
<div class="boxes">
  <button class="box-toggle done" id="toggle-done">✓ Done · <span id="done-count">0</span></button>
  <button class="box-toggle failed" id="toggle-failed">✕ Failed · <span id="failed-count">0</span></button>
</div>
<div class="collapsible" id="done-wrap"><div class="collapsible-inner" id="done-list"></div></div>
<div class="collapsible" id="failed-wrap"><div class="collapsible-inner" id="failed-list"></div></div>

<main>
  <div id="broken-banner-slot"></div>
  <div id="columns"></div>
  <div id="legacy-wrap" hidden>
    <div class="legacy-title">Legacy state-machine tasks (old stage names, shown in the old lanes)</div>
    <div id="lanes"></div>
  </div>
  <div id="empty-state-slot"></div>
</main>
</div>

<div id="view-metrics" hidden></div>

<div id="view-task" tabindex="-1" hidden></div>
</div>

<div class="overlay align-right" id="drawer-overlay" hidden>
  <div class="drawer" id="drawer" tabindex="-1"></div>
</div>

<div class="overlay align-center" id="panel-overlay" hidden>
  <div class="panel" id="new-task-panel"></div>
</div>

<script type="module" src="/static/app.mjs"></script>
</body>
</html>
